<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pruebas de efectos OBS</title>
  <link rel="stylesheet" href="pruebas_efectos.css">
<link rel="stylesheet" href="neo_admin_theme.css?v=50">
<script src="theme_runtime.js?v=50"></script>
</head>
<body>
  <main>
    <p class="eyebrow">BRYNN INTERACTIVE SYSTEM</p>
    <h1>Pruebas de efectos</h1>
    <p class="intro">
      Mantén <b>events_overlay.html</b> visible en OBS y pulsa un botón.
      Estas pruebas no gastan Gumpitas.
    </p>

    <section class="grid">
      <button data-effect="glitch">⚡ Glitch</button>
      <button data-effect="niebla">🌫️ Niebla</button>
      <button data-effect="murcielagos">🦇 Murciélagos</button>
      <button data-effect="calabazas">🎃 Calabazas</button>
      <button data-effect="bonk">🔨 BONK</button>
      <button data-effect="susto">☠️ Mini susto</button>
    </section>

    <div id="status">Listo para probar.</div>
  </main>

  <script src="pruebas_efectos.js"></script>
</body>
</html>
